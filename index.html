<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gen Yus Pro v5.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #fcfcfd;
            -webkit-tap-highlight-color: transparent;
        }

        .active-nav {
            background-color: #4f46e5;
            color: white;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(241, 245, 249, 1);
        }

        .task-enter {
            animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .progress-bar {
            transition: width 0.6s cubic-bezier(0.65, 0, 0.35, 1);
        }

        /* Hide scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-900">

    <div class="min-h-screen flex flex-col md:flex-row">
        
        <!-- Sidebar Navigation -->
        <aside class="w-full md:w-24 bg-white border-r border-slate-100 flex flex-row md:flex-col items-center py-4 md:py-8 px-4 md:px-0 sticky top-0 md:h-screen z-50 justify-between md:justify-start gap-8 shadow-sm md:shadow-none">
            <div class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-indigo-200">
                <i class="fa-solid fa-bolt text-xl"></i>
            </div>
            
            <nav class="flex flex-row md:flex-col gap-4">
                <button onclick="switchTab('home')" id="btn-home" class="w-12 h-12 rounded-2xl flex items-center justify-center transition-all active-nav">
                    <i class="fa-solid fa-house-chimney"></i>
                </button>
                <button onclick="switchTab('focus')" id="btn-focus" class="w-12 h-12 rounded-2xl flex items-center justify-center text-slate-400 hover:bg-slate-50 transition-all">
                    <i class="fa-solid fa-stopwatch"></i>
                </button>
                <button onclick="switchTab('settings')" id="btn-settings" class="w-12 h-12 rounded-2xl flex items-center justify-center text-slate-400 hover:bg-slate-50 transition-all">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </nav>

            <div class="hidden md:flex mt-auto pb-4">
                <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 text-xs font-black">Y</div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-6 md:p-12 pb-32 overflow-y-auto">
            
            <!-- Home Tab -->
            <section id="tab-home" class="max-w-4xl mx-auto space-y-10">
                <!-- Header & Progress -->
                <div class="flex flex-col md:flex-row md:items-end justify-between gap-6">
                    <div>
                        <h2 class="text-3xl font-extrabold tracking-tight">Agenda Hari Ini</h2>
                        <p class="text-slate-400 font-bold text-[10px] uppercase tracking-widest mt-1" id="dateDisplay"></p>
                    </div>
                    <div class="w-full md:w-64 bg-slate-100 h-8 rounded-2xl p-1 relative overflow-hidden">
                        <div id="mainProgress" class="progress-bar absolute top-0 left-0 h-full bg-indigo-500 rounded-2xl" style="width: 0%"></div>
                        <span class="relative z-10 block text-center text-[10px] font-black uppercase text-slate-500 mix-blend-multiply" id="progressText">0% Selesai</span>
                    </div>
                </div>

                <!-- Search & Filters -->
                <div class="flex flex-col md:flex-row gap-4">
                    <div class="flex-1 relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-slate-300"></i>
                        <input type="text" id="searchInput" oninput="renderTasks()" placeholder="Cari agenda..." class="w-full pl-12 pr-6 py-4 bg-white border border-slate-100 rounded-[1.5rem] focus:ring-2 focus:ring-indigo-100 outline-none shadow-sm transition-all text-sm font-medium">
                    </div>
                    <div class="flex gap-2 overflow-x-auto no-scrollbar pb-2">
                        <button onclick="setFilter('all')" class="px-6 py-4 bg-white border border-slate-100 rounded-[1.5rem] text-[10px] font-black uppercase tracking-widest shadow-sm hover:bg-slate-50 filter-btn active-filter" id="f-all">Semua</button>
                        <button onclick="setFilter('Kuliah')" class="px-6 py-4 bg-white border border-slate-100 rounded-[1.5rem] text-[10px] font-black uppercase tracking-widest shadow-sm hover:bg-slate-50 filter-btn" id="f-Kuliah">🎓 Kuliah</button>
                        <button onclick="setFilter('Proyek')" class="px-6 py-4 bg-white border border-slate-100 rounded-[1.5rem] text-[10px] font-black uppercase tracking-widest shadow-sm hover:bg-slate-50 filter-btn" id="f-Proyek">🚀 Proyek</button>
                    </div>
                </div>

                <!-- Task Container -->
                <div id="taskList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Tasks Rendered Here -->
                </div>
            </section>

            <!-- Focus Tab (Pomodoro) -->
            <section id="tab-focus" class="hidden max-w-xl mx-auto py-12 text-center space-y-8">
                <h2 class="text-2xl font-black uppercase tracking-widest">Mode Fokus</h2>
                <div class="w-64 h-64 mx-auto rounded-full border-[12px] border-indigo-50 flex flex-col items-center justify-center relative">
                    <svg class="absolute inset-0 -rotate-90" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="44" stroke="currentColor" stroke-width="8" fill="transparent" class="text-indigo-600 progress-bar" id="timerCircle" stroke-dasharray="276" stroke-dashoffset="0" />
                    </svg>
                    <span class="text-5xl font-black text-slate-900" id="timerDisplay">25:00</span>
                    <span class="text-[10px] font-black text-slate-400 uppercase mt-2">Menit : Detik</span>
                </div>
                <div class="flex justify-center gap-4">
                    <button id="timerBtn" onclick="toggleTimer()" class="px-10 py-5 bg-indigo-600 text-white rounded-[2rem] font-black text-xs uppercase tracking-widest shadow-xl shadow-indigo-100">Mulai Fokus</button>
                    <button onclick="resetTimer()" class="w-14 h-14 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center"><i class="fa-solid fa-rotate-right"></i></button>
                </div>
            </section>

            <!-- Settings Tab -->
            <section id="tab-settings" class="hidden max-w-xl mx-auto space-y-8">
                <h2 class="text-2xl font-black uppercase tracking-widest">Pengaturan</h2>
                <div class="bg-white rounded-[2rem] border border-slate-100 p-8 space-y-6 shadow-sm">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="font-bold">Manajemen Data</p>
                            <p class="text-xs text-slate-400">Cadangkan atau pulihkan semua data agenda Anda.</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="exportData()" class="p-4 bg-slate-50 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-indigo-50 hover:text-indigo-600 transition-all"><i class="fa-solid fa-download mb-2 block text-lg"></i> Ekspor</button>
                        <label class="p-4 bg-slate-50 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-indigo-50 hover:text-indigo-600 transition-all text-center cursor-pointer">
                            <i class="fa-solid fa-upload mb-2 block text-lg"></i> Impor
                            <input type="file" onchange="importData(event)" class="hidden">
                        </label>
                    </div>
                    <button onclick="clearSystem()" class="w-full p-4 border-2 border-red-50 text-red-500 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-red-500 hover:text-white transition-all">Hapus Semua Data Permanen</button>
                </div>
            </section>

        </main>
    </div>

    <!-- Floating Action -->
    <button onclick="toggleModal(true)" class="fixed bottom-8 right-8 w-16 h-16 bg-indigo-600 text-white rounded-2xl shadow-2xl shadow-indigo-200 flex items-center justify-center text-xl z-50 hover:scale-105 transition-transform">
        <i class="fa-solid fa-plus"></i>
    </button>

    <!-- Entry Modal -->
    <div id="modal" class="hidden fixed inset-0 z-[100] bg-slate-900/40 backdrop-blur-sm flex items-end md:items-center justify-center p-0 md:p-6">
        <div class="bg-white w-full max-w-xl rounded-t-[2.5rem] md:rounded-[2.5rem] p-8 md:p-12 shadow-2xl task-enter">
            <div class="flex justify-between items-center mb-8">
                <h3 class="text-xl font-black uppercase tracking-tighter">Tambah Agenda</h3>
                <button onclick="toggleModal(false)" class="text-slate-300 p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <div class="space-y-6">
                <div>
                    <label class="text-[9px] font-black uppercase text-slate-400 tracking-widest mb-2 block">Nama Agenda</label>
                    <input type="text" id="taskTitle" placeholder="Ketik sesuatu..." class="w-full bg-slate-50 border-none rounded-2xl p-5 font-bold focus:ring-2 focus:ring-indigo-100 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[9px] font-black uppercase text-slate-400 tracking-widest mb-2 block">Kategori</label>
                        <select id="taskCategory" class="w-full bg-slate-50 border-none rounded-2xl p-4 font-bold text-xs focus:ring-2 focus:ring-indigo-100 outline-none appearance-none">
                            <option value="Umum">Umum</option>
                            <option value="Kuliah">Kuliah</option>
                            <option value="Proyek">Proyek</option>
                            <option value="Harian">Harian</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[9px] font-black uppercase text-slate-400 tracking-widest mb-2 block">Deadline</label>
                        <input type="date" id="taskDeadline" class="w-full bg-slate-50 border-none rounded-2xl p-4 font-bold text-xs focus:ring-2 focus:ring-indigo-100 outline-none">
                    </div>
                </div>
                <button onclick="saveTask()" class="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black uppercase tracking-widest text-xs shadow-xl shadow-indigo-100">Tambahkan Agenda</button>
            </div>
        </div>
    </div>

    <script>
        // -- STATE MANAGEMENT --
        let tasks = JSON.parse(localStorage.getItem('genyus_v5_tasks')) || [];
        let currentTab = 'home';
        let currentFilter = 'all';
        
        // -- POMODORO STATE --
        let timerSeconds = 25 * 60;
        let timerInterval = null;
        let timerRunning = false;

        // -- CORE FUNCTIONS --
        window.onload = () => {
            updateDate();
            renderTasks();
        };

        function updateDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('dateDisplay').innerText = new Date().toLocaleDateString('id-ID', options);
        }

        function switchTab(tab) {
            document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            
            // Nav styling
            ['home', 'focus', 'settings'].forEach(t => {
                const btn = document.getElementById(`btn-${t}`);
                if(t === tab) btn.classList.add('active-nav');
                else btn.classList.remove('active-nav', 'text-white');
            });
            currentTab = tab;
        }

        function toggleModal(show) {
            document.getElementById('modal').classList.toggle('hidden', !show);
        }

        function setFilter(cat) {
            currentFilter = cat;
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.remove('bg-indigo-600', 'text-white', 'active-filter');
            });
            document.getElementById(`f-${cat}`).classList.add('bg-indigo-600', 'text-white', 'active-filter');
            renderTasks();
        }

        function saveTask() {
            const title = document.getElementById('taskTitle').value;
            const cat = document.getElementById('taskCategory').value;
            const dl = document.getElementById('taskDeadline').value;

            if(!title) return;

            const task = {
                id: Date.now(),
                title,
                category: cat,
                deadline: dl,
                completed: false,
                createdAt: new Date().toISOString()
            };

            tasks.push(task);
            syncAndRender();
            
            // Reset
            document.getElementById('taskTitle').value = '';
            toggleModal(false);
        }

        function toggleComplete(id) {
            tasks = tasks.map(t => t.id === id ? {...t, completed: !t.completed} : t);
            syncAndRender();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            syncAndRender();
        }

        function syncAndRender() {
            localStorage.setItem('genyus_v5_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function renderTasks() {
            const list = document.getElementById('taskList');
            const search = document.getElementById('searchInput').value.toLowerCase();
            list.innerHTML = '';

            let filtered = tasks;
            if(currentFilter !== 'all') filtered = filtered.filter(t => t.category === currentFilter);
            if(search) filtered = filtered.filter(t => t.title.toLowerCase().includes(search));

            // Sorting: Belum selesai di atas
            filtered.sort((a,b) => a.completed - b.completed || new Date(b.createdAt) - new Date(a.createdAt));

            // Update Progress
            const total = filtered.length;
            const done = filtered.filter(t => t.completed).length;
            const percent = total > 0 ? Math.round((done / total) * 100) : 0;
            document.getElementById('mainProgress').style.width = percent + '%';
            document.getElementById('progressText').innerText = percent + '% Selesai';

            if(filtered.length === 0) {
                list.innerHTML = `<div class="col-span-full py-20 text-center opacity-20"><i class="fa-solid fa-magnifying-glass text-4xl mb-4"></i><p class="font-black text-xs uppercase">Tidak ditemukan</p></div>`;
                return;
            }

            filtered.forEach(t => {
                const card = document.createElement('div');
                const isOverdue = t.deadline && new Date(t.deadline) < new Date().setHours(0,0,0,0) && !t.completed;
                
                card.className = `glass-card p-6 rounded-[2rem] flex items-start gap-4 task-enter transition-all ${t.completed ? 'opacity-50' : ''}`;
                card.innerHTML = `
                    <button onclick="toggleComplete(${t.id})" class="mt-1 flex-shrink-0 w-7 h-7 rounded-xl border-2 flex items-center justify-center transition-all ${t.completed ? 'bg-green-500 border-green-500 text-white' : 'border-slate-100 text-transparent'}">
                        <i class="fa-solid fa-check text-[10px]"></i>
                    </button>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2">
                            <h3 class="font-bold text-slate-800 truncate ${t.completed ? 'line-through text-slate-300' : ''}">${t.title}</h3>
                        </div>
                        <div class="flex flex-wrap gap-2 mt-2">
                            <span class="text-[8px] font-black uppercase tracking-widest px-2 py-1 bg-slate-50 text-slate-400 rounded-lg">${t.category}</span>
                            ${t.deadline ? `<span class="text-[8px] font-black uppercase tracking-widest px-2 py-1 ${isOverdue ? 'bg-red-50 text-red-500' : 'bg-indigo-50 text-indigo-500'} rounded-lg"><i class="fa-solid fa-clock mr-1"></i> ${t.deadline}</span>` : ''}
                        </div>
                    </div>
                    <button onclick="deleteTask(${t.id})" class="text-slate-100 hover:text-red-400 transition-colors p-2">
                        <i class="fa-solid fa-trash-can text-sm"></i>
                    </button>
                `;
                list.appendChild(card);
            });
        }

        // -- TIMER LOGIC --
        function toggleTimer() {
            if(timerRunning) {
                clearInterval(timerInterval);
                document.getElementById('timerBtn').innerText = "Lanjutkan";
                timerRunning = false;
            } else {
                timerRunning = true;
                document.getElementById('timerBtn').innerText = "Berhenti";
                timerInterval = setInterval(() => {
                    timerSeconds--;
                    updateTimerUI();
                    if(timerSeconds <= 0) {
                        clearInterval(timerInterval);
                        alert("Waktu fokus habis! Istirahatlah sejenak.");
                        resetTimer();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerSeconds = 25 * 60;
            timerRunning = false;
            document.getElementById('timerBtn').innerText = "Mulai Fokus";
            updateTimerUI();
        }

        function updateTimerUI() {
            const m = Math.floor(timerSeconds / 60);
            const s = timerSeconds % 60;
            document.getElementById('timerDisplay').innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            
            // Progress circle
            const percent = (timerSeconds / (25 * 60)) * 276;
            document.getElementById('timerCircle').style.strokeDashoffset = 276 - percent;
        }

        // -- SETTINGS --
        function exportData() {
            const blob = new Blob([JSON.stringify(tasks)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `genyus_backup_${new Date().toLocaleDateString()}.json`;
            a.click();
        }

        function importData(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (ev) => {
                tasks = JSON.parse(ev.target.result);
                syncAndRender();
                alert("Data berhasil diimpor!");
            };
            reader.readAsText(file);
        }

        function clearSystem() {
            if(confirm("PERINGATAN: Ini akan menghapus seluruh agenda Anda secara permanen. Lanjutkan?")) {
                tasks = [];
                syncAndRender();
            }
        }
    </script>
</body>
</html>
